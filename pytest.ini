[pytest]
# Settings únicos: o ambiente é escolhido por DJANGO_ENV, não por módulo. O CI
# define DJANGO_ENV=development no job de testes.
DJANGO_SETTINGS_MODULE = config.settings

# O padrão do pytest é test_*.py, que não encontra nada aqui: a convenção do
# projeto é tests.py por app. Sem esta linha a suíte é coletada vazia.
python_files = tests.py tests_*.py test_*.py

# Restringe a busca aos apps: deploy/ e scripts/ têm .py que não são teste.
testpaths = core financeiro legal usuarios

addopts = --strict-markers

# Com --strict-markers ligado, marcador não declarado é erro de coleta e não
# aviso — então esta linha é obrigatória, não documentação. Os testes marcados
# `e2e` exigem Playwright e rodam só no job de mesmo nome; o job de testes
# comum os exclui com -m "not e2e".
markers =
    e2e: teste de ponta a ponta em navegador (requer pytest-playwright)
