# a ponta antes de confiar no gatilho automático (ver RUNBOOK.md do rigst/ci,
# seção 7.5).

on:
  workflow_dispatch:

jobs:
  deploy:
    uses: rigst/ci/.github/workflows/deploy-django.yml@6c12d87eb9205a433b172bf5d5f9719be8eb59af  # v1
    secrets:
      CD_SSH_KEY: ${{ secrets.CD_SSH_KEY }}
    with:
      ssh-host: "financas.stolben.com"
